<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html lang="es">
<!-- Define el idioma principal del sitio como español -->

<head>
    <!-- Configuración de caracteres para permitir tildes, ñ y caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Permite que la página se adapte correctamente a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Contacto | BlogDeCafé</title>

    <!-- Descripción de la página para buscadores y SEO -->
    <meta name="description" content="Contacta a BlogDeCafé para resolver dudas, reservar cursos o proponer colaboraciones cafeteras.">

    <!-- Hoja de estilos normalize.css para unificar estilos entre diferentes navegadores -->
    <link rel="stylesheet" href="css/normalize.css">

    <!-- Preconexión con Google Fonts para mejorar el tiempo de carga de las fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Importación de fuentes externas desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

    <!-- Hoja de estilos principal del proyecto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Encabezado principal de la página -->
    <header class="header">

        <!-- Contenedor que centra el contenido y controla el ancho máximo -->
        <div class="contenedor">

            <!-- Barra superior que contiene el logo y el menú de navegación -->
            <div class="barra">

                <!-- Logo del sitio, enlaza hacia la página principal -->
                <a class="logo" href="index.html">
                    <h1 class="logo__nombre no-margin centrar-texto">
                        Blog<span class="logo__bold">DeCafé</span>
                    </h1>
                </a>

                <!-- Menú de navegación principal -->
                <nav class="navegacion" aria-label="Navegación principal">

                    <!-- Enlace hacia la página Nosotros -->
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>

                    <!-- Enlace hacia la página Cursos -->
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>

                    <!-- Enlace activo que indica que el usuario está en la página Contacto -->
                    <a href="contacto.html" class="navegacion__enlace navegacion__enlace--activo">Contacto</a>
                </nav>
            </div>
        </div>

        <!-- Texto principal del encabezado -->
        <div class="header__texto">
            <h2 class="no-margin">Blog de café con consejos y cursos</h2>
            <p class="no-margin">Aprende de los expertos con las mejores recetas y consejos</p>
        </div>
    </header>

    <!-- Contenido principal de la página Contacto -->
    <main class="contenedor">

        <!-- Título principal de la sección -->
        <h3 class="centrar-texto">Contacto</h3>

        <!-- Imagen o fondo decorativo de la sección de contacto definido desde CSS -->
        <div class="contacto-bg"></div>

        <!-- Formulario de contacto del sitio -->
        <form class="formulario" aria-label="Formulario de contacto">

            <!-- Campo para ingresar el nombre del usuario -->
            <div class="campo">

                <!-- Etiqueta asociada al input mediante el atributo for="nombre" -->
                <label class="campo__label" for="nombre">Nombre</label>

                <!-- Input de texto para capturar el nombre -->
                <input 
                    class="campo__field"
                    type="text" 
                    placeholder="Tu Nombre" 
                    id="nombre"
                    name="nombre"
                    autocomplete="name"
                    required
                >
                <!-- 
                    id="nombre": conecta el input con su label.
                    name="nombre": identifica el dato al enviar el formulario.
                    autocomplete="name": permite autocompletar el nombre del usuario.
                    required: obliga a diligenciar este campo antes de enviar.
                -->
            </div>

            <!-- Campo para ingresar el correo electrónico del usuario -->
            <div class="campo">

                <!-- Etiqueta asociada al input mediante el atributo for="email" -->
                <label class="campo__label" for="email">E-mail</label>

                <!-- Input de tipo email para validar que el usuario escriba un correo válido -->
                <input 
                    class="campo__field"
                    type="email" 
                    placeholder="Tu E-mail" 
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
                <!-- 
                    type="email": valida el formato del correo electrónico.
                    id="email": conecta el input con su label.
                    name="email": identifica el dato al enviar el formulario.
                    autocomplete="email": permite autocompletar el correo del usuario.
                    required: obliga a diligenciar este campo antes de enviar.
                -->
            </div>

            <!-- Campo para escribir el mensaje -->
            <div class="campo">

                <!-- Etiqueta asociada al textarea mediante el atributo for="mensaje" -->
                <label class="campo__label" for="mensaje">Mensaje</label>

                <!-- Área de texto para que el usuario escriba su mensaje -->
                <textarea 
                    class="campo__field campo__field--textarea"
                    id="mensaje"
                    name="mensaje"
                    placeholder="Cuéntanos cómo podemos ayudarte"
                    required
                ></textarea>
                <!-- 
                    id="mensaje": conecta el textarea con su label.
                    name="mensaje": identifica el contenido al enviar el formulario.
                    placeholder: muestra una ayuda visual dentro del campo.
                    required: obliga a escribir un mensaje antes de enviar.
                -->
            </div>

            <!-- Campo que contiene el botón de envío del formulario -->
            <div class="campo">

                <!-- Botón para enviar la información ingresada en el formulario -->
                <input 
                    type="submit" 
                    value="Enviar" 
                    class="boton boton--primario"
                >
            </div>
        </form>
    </main>

    <!-- Pie de página del sitio -->
    <footer class="footer">

        <!-- Contenedor del footer -->
        <div class="contenedor">

            <!-- Barra inferior con logo y navegación secundaria -->
            <div class="barra">

                <!-- Logo del sitio en el pie de página -->
                <a class="logo" href="index.html">
                    <h1 class="logo__nombre no-margin centrar-texto">
                        Blog<span class="logo__bold">DeCafé</span>
                    </h1>
                </a>

                <!-- Menú de navegación del pie de página -->
                <nav class="navegacion" aria-label="Navegación del pie de página">

                    <!-- Enlace hacia la página Nosotros -->
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>

                    <!-- Enlace hacia la página Cursos -->
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>

                    <!-- Enlace hacia la página Contacto -->
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>
            </div>
        </div>
    </footer>

    <!-- Archivo JavaScript principal del proyecto -->
    <script src="js/app.js"></script>

    <!-- Archivo JavaScript para detectar compatibilidad del navegador -->
    <script src="js/modernizr.js"></script>
</body>
</html>
